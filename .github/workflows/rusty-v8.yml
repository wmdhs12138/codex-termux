name: rusty-v8

# The V8 that Code Mode links. rusty_v8 (the `v8` crate) publishes no Android archive, so this
# builds one for aarch64-linux-android with the V8 sandbox and publishes it as the release
# rusty-v8-v<version>-b<N>, which scripts/build.sh downloads (N is versions.json's
# rusty_v8_build, the recipe's number). build.yml calls it when the version upstream pins has
# no release yet; a new pin comes every couple of months. See docs/ci.md.
#
#   build   -- x86_64 runner: rusty_v8 only cross-compiles Android from x86_64 Linux. About two
#              hours cold; sccache keeps compiled objects across runs, failed ones included.
#   smoke   -- ARM64 runner + pinned termux-docker: links the archive with Termux's Rust and
#              clang and runs tests/v8-smoke with and without the JIT.
#   publish -- the only job with write permission. Never Latest: install.sh and `codex update`
#              follow /releases/latest.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: rusty_v8 version (the v8 = "=X" pin in upstream codex-rs/Cargo.toml)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      RUSTY_V8_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the host
        run: bash .github/ci/rusty-v8-host.sh

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v8-android-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-v8-android-${{ inputs.version }}-

      - name: Build librusty_v8
        run: bash scripts/build-rusty-v8.sh

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v8-android-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rusty-v8-android
          path: ${{ env.WORK }}/out/
          retention-days: 7
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      TERMUX_DOCKER_IMAGE: termux/termux-docker@sha256:66fb9c3f11ed1a5b2096a8e335fdee198567acc09cfe3b2753a6f85f4ef91ead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rusty-v8-android
          path: v8-out

      - name: Link and run inside Bionic Termux
        run: |
          set -euo pipefail
          docker pull "$TERMUX_DOCKER_IMAGE"
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/data/data/com.termux/files/home/codex-termux" \
            -w /data/data/com.termux/files/home/codex-termux \
            "$TERMUX_DOCKER_IMAGE" bash .github/ci/rusty-v8-smoke.sh v8-out

      - name: Upload v8-smoke
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-smoke
          path: work/v8-smoke/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rusty-v8-android
          path: out

      - name: Publish rusty-v8 release
        run: |
          set -euo pipefail
          TAG="rusty-v8-v$VERSION-b$(jq -r .rusty_v8_build versions.json)"
          R="$GITHUB_REPOSITORY"
          (cd out && sha256sum -c SHA256SUMS)
          if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            echo "$TAG is already published; keeping it"
            exit 0
          fi
          {
            echo "rusty_v8 $VERSION (the \`v8\` crate) built for aarch64-linux-android with the V8 sandbox."
            echo
            echo "Not a Codex release: \`scripts/build.sh\` links this archive into \`codex-code-mode-host\`"
            echo "when upstream pins \`v8 = \"=$VERSION\"\`. rusty_v8 publishes no Android build;"
            echo "\`scripts/build-rusty-v8.sh\` made this one, and \`tests/v8-smoke\` ran it in termux-docker."
            echo
            echo '```'
            cat out/BUILD-INFO.txt
            echo
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          # --target pins the tag to the commit this run built. A concurrent run may have published
          # the same version in the meantime; theirs is as good.
          if ! gh release create "$TAG" -R "$R" --target "$GITHUB_SHA" --latest=false \
                 --title "rusty_v8 $VERSION · Android (${TAG##*-})" --notes-file notes.md \
                 out/librusty_v8_ptrcomp_sandbox_release_aarch64-linux-android.a.gz \
                 out/src_binding_ptrcomp_sandbox_release_aarch64-linux-android.rs \
                 out/SHA256SUMS out/BUILD-INFO.txt out/args.gn; then
            gh release view "$TAG" -R "$R" >/dev/null
            echo "$TAG was published by another run; keeping it"
          fi
